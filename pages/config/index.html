<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群抽奖助手 · 管理面板</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --card2: #fafbfd; --line: #e9edf2;
    --text: #23282f; --muted: #8a93a3; --brand: #e67e22; --brand-d: #c2571a;
    --brand-l: #fff3e8; --ok: #2e9e4f; --ok-l: #e8f7ec; --danger: #e0483d;
    --shadow: 0 2px 14px rgba(40,50,70,.06);
  }
  html[data-theme="dark"] {
    --bg: #15171b; --card: #1e2128; --card2: #23272f; --line: #2c313a;
    --text: #e9ecf1; --muted: #97a0af; --brand: #f0a04b; --brand-d: #f0a04b;
    --brand-l: #33281d; --ok: #4bc471; --ok-l: #1e2f24; --danger: #ef6b61;
    --shadow: 0 2px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  .topbar {
    background: linear-gradient(120deg,var(--brand) 0%,#f0a04b 100%);
    color:#fff; padding: 20px 28px; display:flex; align-items:center; gap:14px;
  }
  .topbar img { width:44px; height:44px; border-radius:11px; background:#fff2; }
  .topbar h1 { font-size:19px; font-weight:800; letter-spacing:.5px; }
  .topbar p { font-size:12px; opacity:.9; margin-top:2px; }
  .wrap { max-width:1080px; margin: 0 auto; padding: 22px 20px 40px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab {
    padding:9px 20px; border-radius:999px; background:var(--card); border:1px solid var(--line);
    color:var(--muted); cursor:pointer; font-weight:600; font-size:14px; transition:.15s;
  }
  .tab:hover { border-color:var(--brand); color:var(--brand-d); }
  .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:var(--shadow); }
  .view { display:none; animation: fade .2s; }
  .view.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1;} }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:18px; }
  .stat {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat .n { font-size:30px; font-weight:800; color:var(--brand-d); line-height:1; }
  .stat .l { color:var(--muted); font-size:13px; margin-top:8px; }
  .stat .ic { position:absolute; right:14px; top:14px; font-size:22px; opacity:.25; }
  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .panel h2 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  .empty { color:var(--muted); text-align:center; padding:34px 0; }
  .layout { display:flex; gap:16px; align-items:flex-start; }
  .glist { width:288px; flex-shrink:0; max-height:70vh; overflow-y:auto; }
  .gdetail { flex:1; min-width:0; }
  .gitem { padding:11px 13px; border:1px solid var(--line); border-radius:11px; margin-bottom:9px;
    cursor:pointer; transition:.15s; background:var(--card2); }
  .gitem:hover { border-color:var(--brand); }
  .gitem.active { border-color:var(--brand); background:var(--brand-l); }
  .gitem .gid { font-weight:700; }
  .gitem .meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .badge { display:inline-block; font-size:11px; padding:1px 9px; border-radius:999px; margin-left:6px; vertical-align:middle;}
  .badge.on { background:var(--ok-l); color:var(--ok); }
  .badge.off { background:var(--line); color:var(--muted); }
  .badge.prize { background:var(--brand-l); color:var(--brand-d); margin:0; }
  .row { display:flex; align-items:center; gap:12px; margin-bottom:13px; flex-wrap:wrap; }
  .row label { width:130px; flex-shrink:0; color:var(--muted); line-height:28px; }
  .row .ctrl { flex:1; min-width:200px; display:flex; align-items:center; }
  .row .ctrl[style*="flex:0"] { display:inline-flex; align-items:center; min-width:0; height:28px; }
  input[type=text],input[type=number],select,textarea {
    width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--text); font-size:14px; font-family:inherit;
  }
  textarea { min-height:56px; resize:vertical; }
  .switch { position:relative; width:52px; height:28px; flex-shrink:0; display:inline-block;
    vertical-align:middle; line-height:28px; }
  .switch input { display:none; }
  .switch .slider { position:absolute; inset:0; background:#cdd3dc; border:1px solid #b7bfca;
    border-radius:999px; cursor:pointer; transition:.2s; }
  .switch .slider::after { content:""; position:absolute; width:22px; height:22px; left:2px; top:2px;
    background:#fff; border:1px solid #d3d8e0; border-radius:50%; transition:.2s;
    box-shadow:0 1px 3px rgba(0,0,0,.28); }
  .switch input:checked + .slider { background:#2e9e4f; border-color:#28a04a; }
  .switch input:checked + .slider::after { transform:translateX(24px); border-color:#2e9e4f; }
  .btns { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  button { padding:9px 20px; border:none; border-radius:9px; cursor:pointer; font-size:14px;
    font-weight:600; font-family:inherit; transition:.15s; }
  .btn-primary { background:var(--brand); color:#fff; }
  .btn-primary:hover { background:var(--brand-d); }
  .btn-ghost { background:var(--card2); border:1px solid var(--line); color:var(--text); }
  .btn-ghost:hover { border-color:var(--brand); }
  .hint { color:var(--muted); font-size:12px; margin-top:3px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { padding:6px 15px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .seg button.sel { background:var(--brand); color:#fff; border-color:var(--brand); }
  .next { font-size:12px; color:var(--muted); line-height:1.7; }
  .section-title { font-size:13px; font-weight:700; color:var(--brand-d); margin:16px 0 11px;
    padding-bottom:6px; border-bottom:1px dashed var(--line); }
  .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:11px 24px; border-radius:999px; font-size:13px;
    opacity:0; transition:.25s; pointer-events:none; z-index:99; }
  .toast.show { opacity:.95; }
  .top-meta { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .mode { font-size:11px; background:rgba(255,255,255,.22); padding:4px 12px; border-radius:999px; letter-spacing:.3px; }
  .view.active { display:block; animation: fade .18s ease; }
  .filters { display:flex; gap:10px; margin-bottom:6px; align-items:center; flex-wrap:wrap; }
  .filters input { width:200px; }
  .win-name { font-weight:700; color:var(--brand-d); }
</style>
<!-- 显式提前引入 bridge SDK：保证内联脚本同步执行时 window.AstrBotPluginPage 已就绪。
     AstrBot 会把这个固定路径改写为带鉴权的真实 SDK 地址；未改写也不影响独立打开。 -->
<script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
<div class="topbar">
  <div style="width:44px;height:44px;border-radius:11px;background:#ffffff33;display:flex;align-items:center;justify-content:center;font-size:26px;">🎰</div>
  <div>
    <h1>🎰 群抽奖助手 · 管理面板</h1>
    <p>总览 · 中奖记录 · 全局配置 · 分群配置（设置按群独立保存，即时生效）</p>
  </div>
  <div class="top-meta">
    <span class="mode">…</span>
  </div>
</div>
<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-view="overview">📊 总览</div>
    <div class="tab" data-view="records">🏆 中奖记录</div>
    <div class="tab" data-view="global">⚙️ 全局配置</div>
    <div class="tab" data-view="groups">🎯 分群配置</div>
  </div>

  <!-- 总览 -->
  <div class="view active" id="view-overview">
    <div class="cards" id="stat-cards"></div>
    <div class="panel">
      <h2>🎉 最近中奖</h2>
      <div id="overview-recent"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <!-- 中奖记录 -->
  <div class="view" id="view-records">
    <div class="panel">
      <h2>🏆 中奖记录</h2>
      <div class="filters">
        <input type="text" id="rec-group" placeholder="按群号筛选（可空）">
        <button class="btn-ghost" id="rec-reload">🔄 刷新</button>
      </div>
      <div id="records"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <!-- 全局配置 -->
  <div class="view" id="view-global">
    <div class="panel">
      <h2>⚙️ 全局默认配置</h2>
      <div id="global-form"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <!-- 分群配置 -->
  <div class="view" id="view-groups">
    <div class="layout">
      <div class="panel glist">
        <h2>群列表</h2>
        <div id="groups"><div class="empty">加载中…</div></div>
      </div>
      <div class="panel gdetail">
        <h2 id="detail-title">选择左侧群进行配置</h2>
        <div id="detail"><div class="empty">暂无选中群</div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 群抽奖助手 · 管理面板
 * 数据层同时兼容两种加载方式：
 *   1) 仪表盘嵌入面板：使用 window.AstrBotPluginPage 桥接（父页面带鉴权），优先；
 *   2) 同源独立打开 / 直接访问本页：回退为同源 fetch 直连 /api/plug/...，
 *      自动携带仪表盘登录 token（localStorage 或同源 cookie），无需手动配置。
 */
const PLUGIN = "astrbot_plugin_group_raffle";
const ORIGIN = window.location.origin;
const OPAGUE_ORIGIN = !ORIGIN || ORIGIN === "null";   // 无 allow-same-origin 的沙箱 iframe
const LEGACY_API = (OPAGUE_ORIGIN ? "" : ORIGIN) + "/api/plug/" + PLUGIN;
// 运行时惰性获取 bridge：不能在解析期把 window.AstrBotPluginPage 存成常量——
// 内联脚本可能先于 SDK 执行，那时它还是 undefined，会被误判为「独立模式」。
function getBridge() {
  try {
    const b = window.AstrBotPluginPage;
    if (b && typeof b.apiGet === "function" && typeof b.apiPost === "function") return b;
  } catch (e) { /* 受限沙箱访问 window 失败，按无 bridge 处理 */ }
  return null;
}

// 读取仪表盘登录态：SPA 将 JWT 存在 localStorage("token")，也尝试从 cookie 读取。
function dashboardToken() {
  try {
    const t = localStorage.getItem("token");
    if (t) return t;
  } catch (e) { /* 沙箱下 localStorage 不可用则忽略 */ }
  try {
    const m = document.cookie.match(/(?:^|;\s*)(?:DASHBOARD_JWT|token)=([^;]*)/i);
    if (m && m[1]) return decodeURIComponent(m[1]);
  } catch (e) { /* 忽略 */ }
  return "";
}

// 归一化：桥接可能直接把 data 负载返回，这里统一成 {status,message,data} 信封。
function norm(r) {
  if (r && typeof r === "object" && typeof r.status === "string" && Object.prototype.hasOwnProperty.call(r, "data")) {
    return r;                                        // 完整信封原样
  }
  return { status: "ok", message: "", data: r };     // 负载包一层标准信封
}

const callSub = sub => String(sub || "").replace(/^\/+/, "").replace(/\/+$/, "");
function buildUrl(sub, query) {
  const p = callSub(sub).split("/").map(encodeURIComponent).join("/");
  const qs = query ? "?" + new URLSearchParams(query).toString() : "";
  return LEGACY_API + "/" + p + qs;
}

// 通用直连请求：open 等 → token 优先；失败 / 401 时回退 cookie 再试一次。
async function request(sub, query, method, body) {
  if (OPAGUE_ORIGIN) {
    return { status: "error", message: "页面处于受限的沙箱环境，请改从 AstrBot 面板内打开「👑 管理面板」使用", data: null };
  }
  let lastErr = null;
  for (const withToken of [true, false]) {
    try {
      const headers = { "Content-Type": "application/json" };
      if (withToken) {
        const t = dashboardToken();
        if (t) headers.Authorization = "Bearer " + t;
      }
      const resp = await fetch(buildUrl(sub, query), {
        method,
        credentials: "include",
        headers,
        body: method === "GET" || body === undefined ? undefined : JSON.stringify(body),
      });
      const text = await resp.text();
      let env = null;
      try { env = text ? JSON.parse(text) : null; } catch (e) { env = null; }
      if (resp.status === 401 || resp.status === 403) {
        lastErr = { status: "error", message: "登录态校验失败（HTTP " + resp.status + "），请确认已登录 AstrBot 面板", data: null };
        continue;                                     // 可能带错 token → 换无 token / cookie
      }
      if (env) return env;
      throw Object.assign(new Error("接口响应异常（HTTP " + resp.status + "）"), { code: resp.status });
    } catch (e) {
      lastErr = { status: "error", message: String((e && e.message) || e) || "网络错误", data: null };
      if (!withToken) break;                    // 无 token 那轮也失败 → 结束
    }
  }
  return lastErr;
}

async function apiGet(sub, params) {
  const bridge = getBridge();
  try {
    if (bridge) return norm(await bridge.apiGet(callSub(sub), params || {}));
    const env = await request(sub, params, "GET");
    return env.status ? env : { status: "ok", message: "", data: env };
  } catch (e) {
    return { status: "error", message: String((e && e.message) || e), data: null };
  }
}

async function apiPost(sub, body) {
  const bridge = getBridge();
  try {
    if (bridge) return norm(await bridge.apiPost(callSub(sub), body || {}));
    const env = await request(sub, null, "POST", body || {});
    return env.status ? env : { status: "ok", message: "", data: env };
  } catch (e) {
    return { status: "error", message: String((e && e.message) || e), data: null };
  }
}

let groups = [], cur = null, curUmo = null;

function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 2400);
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("view-" + t.dataset.view).classList.add("active");
  if (t.dataset.view === "overview") loadOverview();
  if (t.dataset.view === "records") loadRecords();
  if (t.dataset.view === "global") loadGlobal();
  if (t.dataset.view === "groups") loadGroups();
});

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const amp = s => String(s == null ? "" : s).replace(/["\\]/g, c => ({"\\": "\\\\", '"': "\\\""}[c]));
const sw = (id, v) => `<label class="switch"><input type="checkbox" id="${id}" ${v ? "checked" : ""}><span class="slider"></span></label>`;
const val = id => document.getElementById(id).checked;
const sval = id => document.getElementById(id).value;
const segVal = id => document.querySelector("#" + id + " button.sel").dataset.v;

const FAIL = e => `<div class="empty">😵 加载失败：${esc(e)}</div>`;

function winnersTable(rows) {
  if (!rows || !rows.length) return `<div class="empty">暂无中奖记录</div>`;
  return `<table><thead><tr><th>时间</th><th>群</th><th>中奖者</th><th>等次</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.time_str)}</td><td>${esc(r.group_id)}</td>
      <td class="win-name">${esc(r.name || r.uid)}</td><td><span class="badge prize">${esc(r.prize)}</span></td></tr>`)
      .join("") + `</tbody></table>`;
}

async function loadOverview() {
  try {
    const r = await apiGet("overview");
    if (r.status !== "ok") throw new Error(r.message || "数据获取失败");
    const s = (r.data && r.data.stats) || {};
    const cards = [
      ["🎯", "启用群", s.enabled_groups], ["📅", "定时群", s.scheduled_groups],
      ["👥", "观测成员", s.members], ["🎲", "开奖次数", s.draws],
      ["🏆", "中奖人次", s.winners], ["💬", "总群数", s.groups],
    ];
    document.getElementById("stat-cards").innerHTML = cards.map(([ic, l, n]) =>
      `<div class="stat"><div class="ic">${ic}</div><div class="n">${n == null ? 0 : n}</div><div class="l">${l}</div></div>`).join("");
    document.getElementById("overview-recent").innerHTML = winnersTable((r.data && r.data.recent) || []);
  } catch (e) {
    document.getElementById("overview-recent").innerHTML = FAIL(e && e.message || e);
  }
}

async function loadRecords() {
  const gid = sval("rec-group").trim();
  try {
    const r = await apiGet("winners", gid ? { group_id: gid, limit: 300 } : { limit: 300 });
    if (r.status !== "ok") throw new Error(r.message || "数据获取失败");
    document.getElementById("records").innerHTML = winnersTable((r.data && r.data.winners) || []);
  } catch (e) {
    document.getElementById("records").innerHTML = FAIL(e && e.message || e);
  }
}
document.getElementById("rec-reload").onclick = loadRecords;
document.getElementById("rec-group").addEventListener("keydown", e => { if (e.key === "Enter") loadRecords(); });

async function loadGlobal() {
  try {
    const r = await apiGet("global");
    if (r.status !== "ok") throw new Error(r.message || "数据获取失败");
    const c = r.data || {};
    document.getElementById("global-form").innerHTML = `
      <div class="row"><label>群启用模式</label><div class="ctrl"><div class="seg" id="g-mode">
        ${[["blacklist", "黑名单(默认全开)"], ["whitelist", "白名单(仅列出)"]].map(([k, v]) =>
            `<button data-v="${k}" class="${c.enabled_groups_mode === k ? "sel" : ""}">${v}</button>`).join("")}</div></div></div>
      <div class="row"><label>群白名单</label><div class="ctrl"><input type="text" id="g-wl" value="${esc((c.group_whitelist || []).join(","))}">
        <div class="hint">群号，英文逗号分隔</div></div></div>
      <div class="row"><label>群黑名单</label><div class="ctrl"><input type="text" id="g-bl" value="${esc((c.group_blacklist || []).join(","))}">
        <div class="hint">群号，英文逗号分隔</div></div></div>
      <div class="row"><label>额外管理员</label><div class="ctrl"><input type="text" id="g-admins" value="${esc((c.admins || []).join(","))}">
        <div class="hint">用户号，逗号分隔（群主/群管已自动有权限）</div></div></div>
      <div class="row"><label>联系方式</label><div class="ctrl"><input type="text" id="g-contact" value="${esc(c.contact || "")}">
        <div class="hint">追加在模板末尾的联系方式（模板含 &lt;contact&gt; 时替换）</div></div></div>
      <div class="row"><label>默认中奖模板</label><div class="ctrl"><textarea id="g-tpl">${esc(c.default_template || "")}</textarea>
        <div class="hint">占位符 &lt;winners&gt; &lt;count&gt; &lt;group&gt; &lt;time&gt; &lt;contact&gt;</div></div></div>
      <div class="row"><label>默认卡片</label><div class="ctrl" style="flex:0">${sw("g-card", c.card_enabled)}</div></div>
      <div class="row"><label>默认@中奖者</label><div class="ctrl" style="flex:0">${sw("g-at", c.at_enabled)}</div></div>
      <div class="row"><label>新群默认模式</label><div class="ctrl"><div class="seg" id="g-defmode">
        ${[["equal", "全员等权"], ["activity", "活跃度加权"], ["signup", "报名参与"]].map(([k, v]) =>
            `<button data-v="${k}" class="${c.default_mode === k ? "sel" : ""}">${v}</button>`).join("")}</div></div></div>
      <div class="row"><label>每日消息上限</label><div class="ctrl" style="flex:0 0 180px"><input type="number" id="g-cap" value="${c.daily_msg_cap ?? 30}"></div></div>
      <div class="row"><label>最小间隔(秒)</label><div class="ctrl" style="flex:0 0 180px"><input type="number" id="g-gap" value="${c.msg_min_gap_seconds ?? 5}"></div></div>
      <div class="row"><label>数据保留(天)</label><div class="ctrl" style="flex:0 0 180px"><input type="number" id="g-ret" value="${c.data_retention_days ?? 60}"></div></div>
      <div class="btns"><button class="btn-primary" id="g-save">💾 保存全局配置</button></div>`;
    document.querySelectorAll("#g-mode button,#g-defmode button").forEach(b => b.onclick = () => {
      const parent = b.parentElement;
      parent.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
    });
    document.getElementById("g-save").onclick = saveGlobal;
  } catch (e) {
    document.getElementById("global-form").innerHTML = FAIL(e && e.message || e);
  }
}

function listCsv(s) { return s.split(/[,，]/).map(x => x.trim()).filter(Boolean); }

async function saveGlobal() {
  const patch = {
    enabled_groups_mode: segVal("g-mode"),
    group_whitelist: listCsv(sval("g-wl")),
    group_blacklist: listCsv(sval("g-bl")),
    admins: listCsv(sval("g-admins")),
    contact: sval("g-contact"),
    default_template: sval("g-tpl"),
    card_enabled: val("g-card"),
    at_enabled: val("g-at"),
    default_mode: segVal("g-defmode"),
    daily_msg_cap: parseInt(sval("g-cap"), 10) || 30,
    msg_min_gap_seconds: parseInt(sval("g-gap"), 10) || 5,
    data_retention_days: parseInt(sval("g-ret"), 10) || 60,
  };
  const r = await apiPost("global", { patch: st });
  toast(r.status === "ok" ? "✅ 全局配置已保存" : "❌ " + (r.message || "失败"));
}

async function loadGroups() {
  try {
    const r = await apiGet("groups");
    if (r.status !== "ok") throw new Error(r.message || "数据获取失败");
    groups = (r.data && r.data.groups) || [];
    document.getElementById("groups").innerHTML = groups.length ? groups.map(g =>
      `<div class="gitem ${g.umo === curUmo ? "active" : ""}" data-umo="${esc(g.umo)}">
        <div class="gid">群 ${esc(g.umo.split(":")[2] || g.group_id)}<span class="badge ${g.enabled ? "on" : "off"}">${g.enabled ? "启用" : "停用"}</span></div>
        <div class="meta">${g.member_observed} 成员 · ${esc(g.schedule_desc)}</div></div>`).join("")
      : `<div class="empty">还没有群。机器人入群发言，<br>或管理员发送「抽奖 启用」。</div>`;
    document.querySelectorAll(".gitem").forEach(it => it.onclick = () => selectGroup(it.dataset.umo));
  } catch (e) {
    document.getElementById("groups").innerHTML = FAIL(e && e.message || e);
  }
}

async function selectGroup(umo) {
  curUmo = umo;
  document.querySelectorAll(".gitem").forEach(it => it.classList.toggle("active", it.dataset.umo === umo));
  const r = await apiGet("config/" + umo);   // 桥接/直连分别负责各自 URL 转义
  if (r.status !== "ok" || !r.data) { toast("配置加载失败：" + (r.message || "未知错误")); return; }
  cur = r.data;
  renderDetail();
}

function renderDetail() {
  const c = cur;
  const groupId = c.group_id || (c.umo || "").split(":")[2] || "";
  document.getElementById("detail-title").textContent = `群 ${groupId} 配置`;
  const modes = [["equal", "全部等权"], ["activity", "活跃度加权"], ["signup", "报名参与"]];
  const st = [["none", "关闭"], ["daily", "每日"], ["weekly", "每周"], ["biweekly", "每两周"], ["monthly", "每月"], ["custom", "cron"]];
  document.getElementById("detail").innerHTML = `
    <div class="row"><label>启用本群抽奖</label><div class="ctrl" style="flex:0">${sw("f-enabled", c.enabled)}</div></div>
    <div class="section-title">参与与中奖</div>
    <div class="row"><label>参与模式</label><div class="ctrl"><div class="seg" id="f-mode">
      ${modes.map(([k, v]) => `<button data-v="${k}" class="${c.mode === k ? "sel" : ""}">${v}</button>`).join("")}</div></div></div>
    <div class="row"><label>中奖等次名额</label><div class="ctrl"><input type="text" id="f-prizes"
      value="${esc(c.prizes.map(p => p.name + ":" + p.count).join(","))}"><div class="hint">一等奖:1,二等奖:2</div></div></div>
    <div class="row"><label>防连中冷却(天)</label><div class="ctrl" style="flex:0 0 160px">
      <input type="number" id="f-cooldown" value="${c.cooldown_days}" min="0"></div></div>
    <div class="row"><label>排除管理员</label><div class="ctrl" style="flex:0">${sw("f-exadmins", c.exclude_admins)}</div></div>
    <div class="section-title">活跃度加权</div>
    <div class="row"><label>统计窗口(天)</label><div class="ctrl" style="flex:0 0 160px"><input type="number" id="f-window" value="${c.activity_window_days}"></div></div>
    <div class="row"><label>最低发言条数</label><div class="ctrl" style="flex:0 0 160px"><input type="number" id="f-mincount" value="${c.activity_min_count}"></div></div>
    <div class="section-title">通知与卡片</div>
    <div class="row"><label>@中奖者</label><div class="ctrl" style="flex:0">${sw("f-at", c.at_winners)}</div></div>
    <div class="row"><label>开奖卡片</label><div class="ctrl" style="flex:0">${sw("f-card", c.card_enabled)}</div></div>
    <div class="row"><label>中奖模板</label><div class="ctrl"><textarea id="f-template">${esc(c.template || "")}</textarea>
      <div class="hint">占位符 &lt;winners&gt; &lt;count&gt; &lt;group&gt; &lt;time&gt; &lt;contact&gt;</div></div></div>
    <div class="section-title">定时开奖</div>
    <div class="row"><label>定时类型</label><div class="ctrl"><div class="seg" id="f-st">
      ${st.map(([k, v]) => `<button data-v="${k}" class="${c.schedule.type === k ? "sel" : ""}">${v}</button>`).join("")}</div></div></div>
    <div class="row"><label>时间(HH:MM)</label><div class="ctrl" style="flex:0 0 160px"><input type="text" id="f-time" value="${esc(c.schedule.time || "20:00")}"></div></div>
    <div class="row" id="row-wd" style="display:none"><label>星期</label><div class="ctrl" style="flex:0 0 160px">
      <select id="f-wd">${["周一", "周二", "周三", "周四", "周五", "周六", "周日"].map((w, i) =>
        `<option value="${i}" ${c.schedule.weekday === i ? "selected" : ""}>${w}</option>`).join("")}</select></div></div>
    <div class="row" id="row-md" style="display:none"><label>每月日期</label><div class="ctrl" style="flex:0 0 160px">
      <input type="number" id="f-md" value="${c.schedule.monthday || 1}" min="1" max="28"></div></div>
    <div class="row" id="row-cron" style="display:none"><label>cron</label><div class="ctrl">
      <input type="text" id="f-cron" value="${esc(c.schedule.cron || "")}" placeholder="0 20 * * 5">
      <div class="hint">5 段：分 时 日 月 周</div></div></div>
    <div class="next" id="f-next">${(c.next_fires || []).map(x => "· " + x).join("<br>")}</div>
    <div class="btns">
      <button class="btn-primary" id="btn-save">💾 保存</button>
      <button class="btn-ghost" id="btn-refresh">🔄 刷新</button>
      <button class="btn-ghost" id="btn-draw">🎲 立即开奖</button>
    </div>`;
  document.querySelectorAll("#f-mode button,#f-st button").forEach(b => b.onclick = () => {
    const parent = b.parentElement;
    parent.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    if (b.parentElement.id === "f-st") syncSched();
  });
  const syncSched = () => {
    const t = segVal("f-st");
    document.getElementById("row-wd").style.display = (t === "weekly" || t === "biweekly") ? "flex" : "none";
    document.getElementById("row-md").style.display = (t === "monthly") ? "flex" : "none";
    document.getElementById("row-cron").style.display = (t === "custom") ? "flex" : "none";
  };
  syncSched();
  document.getElementById("btn-save").onclick = saveDetail;
  document.getElementById("btn-refresh").onclick = () => selectGroup(curUmo);
  document.getElementById("btn-draw").onclick = doDraw;
}

function readSched() {
  const t = segVal("f-st");
  const s = { type: t, time: sval("f-time"), weekday: 0, monthday: 1, cron: "" };
  if (t === "weekly" || t === "biweekly") s.weekday = parseInt(sval("f-wd"), 10) || 0;
  if (t === "monthly") s.monthday = parseInt(sval("f-md"), 10) || 1;
  if (t === "custom") s.cron = sval("f-cron").trim();
  return s;
}

async function saveDetail() {
  const patch = {
    enabled: val("f-enabled"), mode: segVal("f-mode"), prizes: sval("f-prizes").trim(),
    cooldown_days: parseInt(sval("f-cooldown"), 10) || 0, exclude_admins: val("f-exadmins"),
    activity_window_days: parseInt(sval("f-window"), 10) || 7, activity_min_count: parseInt(sval("f-mincount"), 10) || 0,
    at_winners: val("f-at"), card_enabled: val("f-card"), template: sval("f-template"), schedule: readSched(),
  };
  const r = await apiPost("config", { umo: curUmo, patch: patch });
  if (r.status === "ok") {
    toast("✅ 已保存");
    cur = r.data;
    renderDetail();
    loadGroups();
  } else {
    toast("❌ " + (r.message || "保存失败"));
  }
}

async function doDraw() {
  if (!confirm("确定立即开奖？会真实发送开奖消息并记录中奖。")) return;
  const r = await apiPost("draw", { umo: curUmo });
  toast(r.status === "ok" ? "🎲 开奖指令已执行" : "❌ " + (r.message || "失败"));
}

/* ---------- 启动 ----------
 * 在仪表盘嵌入页等待桥接就绪；若桥接缺失（独立打开）或超时，立即回退直连加载，避免一直「加载中」。 */
async function bootstrap() {
  const bridge = getBridge();
  if (bridge) {
    try {
      if (typeof bridge.ready === "function") {
        await Promise.race([bridge.ready(), new Promise(res => setTimeout(res, 3000))]);
      }
    } catch (e) { /* 桥接异常则忽略 */ }
  }
  const modeEl = document.querySelector(".topbar .mode");
  if (modeEl) modeEl.textContent = bridge ? "嵌入模式" : "独立模式";
  loadOverview();
  loadGroups();
}

bootstrap();
</script>
</body>
</html>
