<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    width:480px;
    background:linear-gradient(160deg,#fff7ec 0%,#ffe9d6 55%,#ffd9b8 100%);
    color:#5a3210; padding:26px 26px 18px;
  }
  .title { text-align:center; font-size:24px; font-weight:800; letter-spacing:1px; }
  .sub { text-align:center; font-size:12px; color:#9a6a3a; margin:8px 0 14px; }
  .section {
    background:rgba(255,255,255,.72); border-radius:14px; padding:12px 16px; margin:10px 0;
  }
  .heading {
    font-size:15px; font-weight:800; color:#c2571a; margin-bottom:8px;
    padding-bottom:6px; border-bottom:1px dashed rgba(194,87,26,.28);
  }
  .item { font-size:15px; color:#3d2200; line-height:1.7; word-break:break-all; }
  .item .dot { color:#e67e22; font-weight:800; margin-right:6px; }
  .foot { text-align:center; font-size:11px; color:#b08a5e; margin-top:14px; }
</style>
</head>
<body>
  <div class="title">{{ title }}</div>
  {% if subtitle %}<div class="sub">{{ subtitle }}</div>{% endif %}
  {% for s in sections %}
  <div class="section">
    {% if s.heading %}<div class="heading">{{ s.heading }}</div>{% endif %}
    {% for it in s.items %}
    <div class="item"><span class="dot">·</span>{{ it }}</div>
    {% endfor %}
  </div>
  {% endfor %}
  <div class="foot">群抽奖助手 GroupRaffle</div>
</body>
</html>
